# =============================================================================
# .gitlab-ci.yml — Multi-Agent Test Automation Pipeline
# Runs both Cypress and Playwright tests and publishes JUnit results.
# =============================================================================

stages:
  - install
  - test
  - report

variables:
  BASE_URL: "http://your-app-url"   # Override per environment
  NODE_VERSION: "20"

# ── Install ──────────────────────────────────────────────────────────────────
install-deps:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npx playwright install --with-deps
  cache:
    key: "$CI_COMMIT_REF_SLUG-node"
    paths:
      - node_modules/
      - ~/.cache/ms-playwright/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ── Cypress ──────────────────────────────────────────────────────────────────
cypress-tests:
  stage: test
  image: cypress/included:13.0.0
  needs: [install-deps]
  script:
    - mkdir -p output/cypress-results
    - npx cypress run --reporter junit --reporter-options "mochaFile=output/cypress-results/results-[hash].xml"
  artifacts:
    when: always
    reports:
      junit: output/cypress-results/results-*.xml
    paths:
      - output/cypress-results/
      - cypress/screenshots/
      - cypress/videos/
    expire_in: 7 days

# ── Playwright ───────────────────────────────────────────────────────────────
playwright-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.44.0-jammy
  needs: [install-deps]
  script:
    - mkdir -p output/playwright-results output/playwright-report
    - npx playwright test
  artifacts:
    when: always
    reports:
      junit: output/playwright-results/results.xml
    paths:
      - output/playwright-results/
      - output/playwright-report/
    expire_in: 7 days

# ── Aggregate results (job the results agent looks for) ───────────────────────
test-results:
  stage: report
  image: alpine:latest
  needs:
    - job: cypress-tests
      artifacts: true
    - job: playwright-tests
      artifacts: true
  script:
    - echo "All test results collected."
    - ls -R output/
  artifacts:
    when: always
    paths:
      - output/
    expire_in: 30 days
