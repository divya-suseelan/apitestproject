# =============================================================================
# .gitlab-ci.yml — Multi-Agent Test Automation Pipeline
# Runs EITHER Cypress OR Playwright (BDD/Cucumber) based on the TEST_FRAMEWORK
# CI/CD variable.  Set TEST_FRAMEWORK to "cypress" or "playwright" in your
# GitLab project's Settings → CI/CD → Variables.
# =============================================================================

stages:
  - install
  - test
  - report

variables:
  BASE_URL: "http://your-app-url"   # Override per environment
  NODE_VERSION: "20"
  TEST_FRAMEWORK: "cypress"         # "cypress" | "playwright"  — set in GitLab variables

# ── Install ──────────────────────────────────────────────────────────────────
install-deps:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - |
      if [ "$TEST_FRAMEWORK" = "playwright" ]; then
        npx playwright install --with-deps
      fi
  cache:
    key: "$CI_COMMIT_REF_SLUG-$TEST_FRAMEWORK-node"
    paths:
      - node_modules/
      - ~/.cache/ms-playwright/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ── Cypress (BDD via @badeball/cypress-cucumber-preprocessor) ─────────────────
cypress-tests:
  stage: test
  image: cypress/included:13.0.0
  needs: [install-deps]
  rules:
    - if: '$TEST_FRAMEWORK == "cypress"'
  script:
    - mkdir -p output/cypress-results
    - npx cypress run
  artifacts:
    when: always
    reports:
      junit: output/cypress-results/results-*.xml
    paths:
      - output/cypress-results/
      - cypress/screenshots/
      - cypress/videos/
    expire_in: 7 days

# ── Playwright (BDD via playwright-bdd) ─────────────────────────────────────
playwright-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.44.0-jammy
  needs: [install-deps]
  rules:
    - if: '$TEST_FRAMEWORK == "playwright"'
  script:
    - mkdir -p output/playwright-results output/playwright-report
    - npx bddgen          # generate Playwright test files from .feature files
    - npx playwright test
  artifacts:
    when: always
    reports:
      junit: output/playwright-results/results.xml
    paths:
      - output/playwright-results/
      - output/playwright-report/
      - .bdd-output/
    expire_in: 7 days

# ── Aggregate results (job the results agent looks for) ───────────────────────
test-results:
  stage: report
  image: alpine:latest
  needs:
    - job: cypress-tests
      artifacts: true
      optional: true
    - job: playwright-tests
      artifacts: true
      optional: true
  script:
    - echo "Framework: $TEST_FRAMEWORK"
    - echo "All test results collected."
    - ls -R output/ 2>/dev/null || echo "No output directory"
  artifacts:
    when: always
    paths:
      - output/
    expire_in: 30 days

